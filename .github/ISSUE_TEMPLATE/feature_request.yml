name: 功能建議
description: 提出新功能、支援格式或使用體驗的建議
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        請描述要解決的問題與使用情境，而不是只列功能名稱。
        本專案目前以 Windows x64、FTB Quests 與 KubeJS 為主要範圍。
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 目前遇到什麼困難？影響哪些使用者或流程？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議做法
      description: 你希望 QTrans 如何處理？可描述操作流程或輸出格式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你試過或考慮過的其他做法。
  - type: dropdown
    id: scope
    attributes:
      label: 影響範圍
      options:
        - GUI
        - CLI
        - 翻譯服務／供應商
        - 掃描與回寫格式
        - 安裝／更新
        - 文件
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 確認事項
      options:
        - label: 我已確認內容不含 API 金鑰、私人模組包或個人資料。
          required: true
