name: 錯誤回報
description: 回報可重現的程式錯誤、輸出異常或安裝問題
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感謝回報。請先移除 API 金鑰、私人模組包內容與個人資料。
        安全性問題請改用 Security → Report a vulnerability，不要開公開 issue。
  - type: input
    id: version
    attributes:
      label: QTrans 版本
      description: 安裝版可在說明或 Release 頁確認；自行建置請提供 commit。
      placeholder: "例如 0.1.4 或 commit ec1a2a0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 問題類別
      options:
        - 安裝／升級／解除安裝
        - GUI 介面或操作
        - 翻譯流程或 API
        - ZIP 解包／回寫／打包
        - CLI
        - 文件或其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      description: 請列出最小且可重現的步驟。
      placeholder: |
        1. 開啟 ...
        2. 選擇 ...
        3. 觀察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 實際結果
      description: 可附上已去除敏感資訊的日誌或截圖。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 環境
      placeholder: "Windows 11 x64；模組包版本；使用的翻譯供應商"
  - type: checkboxes
    id: confirm
    attributes:
      label: 確認事項
      options:
        - label: 我已確認內容不含 API 金鑰、私人模組包或個人資料。
          required: true
        - label: 我已搜尋既有 issue，確認不是重複回報。
          required: true
