version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        # Major upgrades need code changes (for example ureq 2 -> 3 and
        # sha2 0.10 -> 0.11) and are handled as dedicated changes.
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: gomod
    directory: /go/translator
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
