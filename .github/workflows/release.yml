name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $manifest = Get-Content -Raw Cargo.toml
          if ($manifest -notmatch '(?ms)^\[workspace\.package\]\s*.*?^version\s*=\s*"([^"]+)"') {
            throw "Could not read the workspace version."
          }
          $manifestVersion = $Matches[1]
          $tagVersion = $env:RELEASE_TAG.TrimStart("v")
          if ($manifestVersion -ne $tagVersion) {
            throw "Tag v$tagVersion does not match Cargo.toml version $manifestVersion."
          }

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Test Go translator
        working-directory: go/translator
        run: go test ./...

      - name: Vet Go translator
        working-directory: go/translator
        run: go vet ./...

      - name: Build installer
        shell: pwsh
        run: .\scripts\package-windows.ps1

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installer = "dist/QTrans-Setup-x64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Encoding ascii "$installer.sha256" "$hash  QTrans-Setup-x64.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/QTrans-Setup-x64.exe
            dist/QTrans-Setup-x64.exe.sha256
