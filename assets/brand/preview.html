<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QTrans 品牌標誌預覽</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      color: #0b1020;
      background: #f3f6f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      padding: clamp(24px, 6vw, 72px);
    }

    main {
      width: min(100%, 1040px);
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #287c61;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: -.04em;
    }

    .intro {
      max-width: 640px;
      margin: 14px 0 36px;
      color: #536176;
      font-size: 16px;
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 18px;
      align-items: stretch;
    }

    .card {
      display: flex;
      min-height: 250px;
      align-items: center;
      justify-content: center;
      padding: 32px;
      border: 1px solid #dfe6e8;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 40px rgb(11 16 32 / 6%);
    }

    .card img { display: block; width: 100%; height: auto; }
    .icon-card img { width: 164px; }

    .details {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .detail {
      padding: 18px;
      border: 1px solid #dfe6e8;
      border-radius: 14px;
      background: #fff;
    }

    .detail strong { display: block; margin-bottom: 7px; font-size: 14px; }
    .detail span { color: #536176; font-size: 13px; line-height: 1.55; }

    .swatch {
      display: inline-block;
      width: 11px;
      height: 11px;
      margin-right: 5px;
      border-radius: 3px;
      vertical-align: -1px;
    }

    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 190px; padding: 22px; }
      .icon-card { min-height: 210px; }
      .details { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Brand study · 2026</p>
    <h1>QTrans 標誌草稿</h1>
    <p class="intro">
      以任務方塊與像素路徑構成原創識別，搭配現有介面的午夜藍與薄荷綠。
      SVG 使用純量向量與白底，不引用 Minecraft 遊戲素材或外部字型。
    </p>
    <section class="grid" aria-label="標誌預覽">
      <div class="card">
        <img src="qtrans-logo.svg" alt="QTrans 橫式標誌：幾何任務方塊與 QTrans 字標">
      </div>
      <div class="card icon-card">
        <img src="qtrans-icon.svg" alt="QTrans 方形圖示">
      </div>
    </section>
    <section class="details" aria-label="設計說明">
      <div class="detail">
        <strong>圖形概念</strong>
        <span>像素任務方塊與對話路徑，呼應任務文本與本機化工作流程。</span>
      </div>
      <div class="detail">
        <strong>色彩</strong>
        <span><i class="swatch" style="background:#0b1020"></i>午夜藍
          <i class="swatch" style="background:#49d49d"></i>薄荷綠
          <i class="swatch" style="background:#f1f5f9"></i>霧白</span>
      </div>
      <div class="detail">
        <strong>使用範圍</strong>
        <span>README、桌面介面識別與安裝包品牌素材；正式圖示仍需 Windows 套件驗收。</span>
      </div>
    </section>
  </main>
</body>
</html>
